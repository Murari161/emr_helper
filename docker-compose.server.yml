# Additions for the online server (askeafya.com). Not used on laptops or at
# facilities. The server's .env switches it on with:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.server.yml
#   DOMAIN=askeafya.com
#
# so plain `docker compose ...` commands use both files there.

services:
  caddy:
    ports:
      - "80:80"         # HTTP: certificate checks, then forwarding to HTTPS
      - "443:443"       # HTTPS
      - "443:443/udp"   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, for example DOMAIN=askeafya.com}
      # Optional: more domains that forward to DOMAIN, separated by spaces.
      OTHER_DOMAINS: ${OTHER_DOMAINS:-}
    volumes:
      # Replaces the laptop Caddyfile (same path inside the container).
      - ./caddy/Caddyfile.server:/etc/caddy/Caddyfile:ro
