# Chainlit configuration for EMR Helper.
# Full reference: https://docs.chainlit.io/backend/config/overview

[project]
# Enables the cleanup of old chats on session end.
enable_telemetry = false
# No keys are asked of the user. Logins are handled by Chainlit's login page,
# against the accounts in app_users (app/auth.py).
user_env = []
# Time before a session is reclaimed (seconds).
session_timeout = 3600
# We do not want Chainlit to cache any uploaded files.
cache = false
# Authorised origins. Tighten this in production once a hostname is assigned.
allow_origins = ["*"]

[features]
# We rely on streaming once Phase 5 lands; enable it from day one.
unsafe_allow_html = false
latex = false

  [features.spontaneous_file_upload]
  enabled = false

[UI]
name = "eAFYA Assistant"
description = "Documentation assistant for eAFYA, the Ministry of Health Uganda EMR system. Ask how to do any task and get the steps + screenshots from the official user manuals. Does not access patient data and does not give clinical advice."
default_collapse_content = true
default_theme = "light"
# Custom CSS: header logo size, green "Open: …" buttons, Caution / Note boxes.
# Served by Chainlit's static handler from the project's public/ folder.
# BUMP ?v= WHENEVER style.css OR script.js CHANGES: browsers otherwise keep
# using a cached copy, even after a hard refresh, and users miss the change.
custom_css = "/public/style.css?v=5"
# Custom JS: tags the "Open: …" buttons (.emr-cta) and the Caution / Note
# boxes (.emr-caution / .emr-note) by their visible text, so the CSS can style
# them regardless of Chainlit's internal class names. Also adds "Change your
# password" and "Manage accounts" to the user menu at the top right.
custom_js = "/public/script.js?v=5"
# CTA shown on the welcome screen above the suggested-question buttons.
cot = "tool_call"

[meta]
generated_by = "phase-1-scaffold"
