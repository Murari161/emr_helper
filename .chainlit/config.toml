# Chainlit configuration for EMR Helper.
# Full reference: https://docs.chainlit.io/backend/config/overview

[project]
# Enables the cleanup of old chats on session end.
enable_telemetry = false
# Allow the bot to be accessed by anonymous users; the reverse proxy (Caddy)
# is responsible for authentication and passes a signed user header.
user_env = []
# Time before a session is reclaimed (seconds).
session_timeout = 3600
# We do not want Chainlit to cache any uploaded files.
cache = false
# Authorised origins. Tighten this in production once a hostname is assigned.
allow_origins = ["*"]

[features]
# We rely on streaming once Phase 5 lands; enable it from day one.
unsafe_allow_html = false
latex = false

  [features.spontaneous_file_upload]
  enabled = false

[UI]
name = "EMR Helper"
description = "Documentation assistant for the Ministry of Health Uganda EMR system. Ask how to do any task and get the steps + screenshots from the official user manuals. Does not access patient data and does not give clinical advice."
default_collapse_content = true
default_theme = "light"
# Custom CSS to enlarge the MoH coat-of-arms logo in the header.
# Served by Chainlit's static handler from the project's public/ folder.
custom_css = "/public/style.css"
# Custom JS: tags the cross-reference "Open: …" action buttons with a class
# (.emr-cta) by their visible text, so the CSS can style them reliably
# regardless of Chainlit's internal button class names.
custom_js = "/public/script.js"
# CTA shown on the welcome screen above the suggested-question buttons.
cot = "tool_call"

[meta]
generated_by = "phase-1-scaffold"
