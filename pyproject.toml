[project]
name = "emr-helper"
version = "0.1.0"
description = "Standalone documentation chatbot for the Ministry of Health EMR system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EMR Helper team" }]

dependencies = [
    # Chat surface. Chainlit pulls in its own pinned uvicorn transitively;
    # we deliberately do NOT pin uvicorn ourselves to avoid resolver conflicts
    # whenever Chainlit updates its uvicorn range.
    "chainlit>=2.0,<3.0",

    # Web framework. Chainlit embeds FastAPI internally, but we depend on it
    # directly so we can mount our own endpoints if needed (health, metrics).
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.12",

    # Config and validation
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",

    # Database
    "asyncpg>=0.30,<1.0",
    "pgvector>=0.3.6,<1.0",

    # Document ingestion (Word manuals)
    "python-docx>=1.1.2,<2.0",

    # Ollama HTTP client
    "httpx>=0.27,<1.0",

    # Cross-encoder reranker for the RAG pipeline. sentence-transformers
    # lazily loads BAAI/bge-reranker-v2-m3 in-process (CPU). Adds ~1 GB to
    # the image (torch+transformers); the model itself is ~600 MB and is
    # downloaded into a HuggingFace cache on first use. We considered using
    # Ollama for this but Ollama has no cross-encoder reranking API — its
    # /api/embeddings is bi-encoder-only, which produces wrong relevance
    # signals for (query, doc) scoring.
    "sentence-transformers>=3.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
