[project]
name = "emr-helper"
version = "0.1.0"
description = "Standalone documentation chatbot for the Ministry of Health EMR system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EMR Helper team" }]

dependencies = [
    # Chat surface
    "chainlit>=1.3,<2.0",

    # Web / async runtime
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "python-multipart>=0.0.12",

    # Config and validation
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",

    # Database
    "asyncpg>=0.30,<1.0",
    "pgvector>=0.3.6,<1.0",

    # Document ingestion (Word manuals)
    "python-docx>=1.1.2,<2.0",

    # Ollama HTTP client
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
